# ##############################################################################
# Deploy demo — automatic deployment to Google Cloud Run
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   On every push to `main` (or a manual run) it:
#     1) runs the CI workflow (ci-docker.yml, job `test-and-docker`) first,
#     2) authenticates to Google Cloud WITHOUT a key file (Workload Identity
#        Federation),
#     3) builds + pushes the image tagged with the commit SHA,
#     4) runs deploy/release.sh (verify image -> migrate -> update service),
#     5) smoke-tests the public URL (deploy/smoke_test.py),
#     6) writes a deployment summary.
#   MANUAL ROLLBACK: run the workflow by hand and enter `image_tag` = the full
#   40-character commit SHA of an image that already exists. Tests, build and
#   migration are skipped; only the service is pointed back to that image.
# ##############################################################################

name: Deploy demo

# ------------------------------------------------------------------------------
# Triggers
#   push to main      : automatic deploy
#   workflow_dispatch : manual run; `image_tag` = rollback target (optional)
# ------------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full commit SHA of an existing image. Empty = test, build and deploy current main.'
        type: string
        required: false
        default: ''

# Least privilege by default; the deploy job adds `id-token: write` below.
permissions:
  contents: read

# Queue releases; do not interrupt a running migration or deployment.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: run the CI workflow (its job id is `test-and-docker`).
  # Skipped for rollbacks (image_tag set) and for anything that is not `main`.
  # ----------------------------------------------------------------------------
  test:
    if: github.ref == 'refs/heads/main' && !inputs.image_tag
    uses: ./.github/workflows/ci-docker.yml

  # ----------------------------------------------------------------------------
  # Job 2: build, migrate, deploy, smoke-test.
  # Only runs if tests passed (or this is a manual rollback).
  # ----------------------------------------------------------------------------
  deploy:
    needs: test
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    permissions:
      contents: read
      id-token: write # required for keyless Google Cloud login (WIF)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE_NAME: popqueue
      MIGRATE_JOB_NAME: popqueue-migrate
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ROLLBACK: ${{ inputs.image_tag != '' }}
    steps:
      # ------------------------------------------------------------------------
      # 1. Get the source code
      # ------------------------------------------------------------------------
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------------
      # 2. Fail early if settings are missing or the tag is not a full SHA
      # ------------------------------------------------------------------------
      - name: Validate deployment settings
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROJECT_ID" && test -n "$REGION"
          test -n "$WIF_PROVIDER" && test -n "$WIF_SERVICE_ACCOUNT"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Image tag must be a full 40-character commit SHA.'; exit 1; }

      # ------------------------------------------------------------------------
      # 3. Log in to Google Cloud with Workload Identity Federation (no key file)
      # ------------------------------------------------------------------------
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # ------------------------------------------------------------------------
      # 4. Build and push the image (skipped for rollbacks)
      # ------------------------------------------------------------------------
      - name: Build and push image
        if: env.ROLLBACK != 'true'
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/popqueue/popqueue:$IMAGE_TAG"
          docker build --build-arg GIT_SHA="$IMAGE_TAG" --tag "$IMAGE" .
          docker push "$IMAGE"

      # ------------------------------------------------------------------------
      # 5. Verify image -> run migration job -> update Cloud Run service
      # ------------------------------------------------------------------------
      - name: Verify image, migrate and deploy
        run: bash deploy/release.sh

      # ------------------------------------------------------------------------
      # 6. Smoke test the live URL
      # ------------------------------------------------------------------------
      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Smoke test public URL
        env:
          SMOKE_USER: ${{ vars.SMOKE_USER || vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: python3 deploy/smoke_test.py "$SERVICE_URL"

      # ------------------------------------------------------------------------
      # 7. Deployment summary shown on the workflow run page
      # ------------------------------------------------------------------------
      - name: Record deployment
        run: |
          {
            echo '### PopQueue demo deployment'
            echo "- Commit image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$DEPLOYED_IMAGE\`"
            echo "- Rollback: $ROLLBACK"
            echo "- URL: $SERVICE_URL"
            echo '- Smoke test: passed (health, readiness/DB, HTML, series catalogue).'
            echo '- See smoke step for optional login check status.'
          } >> "$GITHUB_STEP_SUMMARY"
