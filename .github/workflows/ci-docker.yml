# ##############################################################################
# CI — "CI & Docker Build" (Lab 5 Issue 4 — Check C-01, Requirement R-05)
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   Implements the automated CI pipeline on pull requests per Lab 5 Episode 4
#   (GitHub Issue #27). Runs on every PR targeting `main` and `lab5-staging`.
#   Used in two ways:
#     1) directly on every pull request to `main` and `lab5-staging` (Check C-01),
#     2) as a REUSABLE workflow called by deploy.yml (`workflow_call`) so the
#        deploy only starts after these checks pass.
#   Quality Gate Steps:
#     1) Deploy scripts: offline stub tests + syntax check
#     2) Backend: real PostgreSQL 16 service container + migrate deploy + seed + tests
#     3) Frontend: tests + production build
#     4) Production Docker image build check
#   It does NOT deploy anything.
# ##############################################################################

name: CI & Docker Build

# ------------------------------------------------------------------------------
# Triggers
#   workflow_call     : lets deploy.yml reuse this workflow (do not remove).
#   pull_request      : checks every PR to staging and main before merge.
#   workflow_dispatch : manual "Run workflow" button.
# ------------------------------------------------------------------------------
on:
  workflow_call:
  pull_request:
    branches: [main, lab5-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id must stay `test-and-docker` as required by Lab 5 / branch ruleset.
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: popqueue
          POSTGRES_PASSWORD: popqueue_dev_password
          POSTGRES_DB: popqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ------------------------------------------------------------------------
      # 1. Get the source code
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------------
      # 2. Language runtimes
      # ------------------------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # ------------------------------------------------------------------------
      # 3. Deploy scripts: syntax check + offline tests (NO access to GCP)
      # ------------------------------------------------------------------------
      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      # ------------------------------------------------------------------------
      # 4. Backend: install -> migrate -> seed -> test
      # ------------------------------------------------------------------------
      - name: Install & Test Backend (Prisma Migrate + Seed + Vitest)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://popqueue:popqueue_dev_password@localhost:5432/popqueue_test?schema=public
          DATABASE_URL_TEST: postgresql://popqueue:popqueue_dev_password@localhost:5432/popqueue_test?schema=public
          JWT_SECRET: a-very-long-secret-key-that-has-at-least-32-chars!
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
          npm test

      # ------------------------------------------------------------------------
      # 5. Frontend: install -> test -> production build
      # ------------------------------------------------------------------------
      - name: Install, Test & Build Frontend (Vitest + Production Build)
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      # ------------------------------------------------------------------------
      # 6. Make sure the unified production image builds
      # ------------------------------------------------------------------------
      - name: Verify Unified Production Dockerfile Build
        run: |
          docker build -t popqueue:latest .
