# PopQueue Local Development Database
# Dev PostgreSQL 16 database only. Full application multi-stage image & CI/CD come in Lab 5.

services:
  db:
    image: postgres:16
    container_name: popqueue_db
    environment:
      POSTGRES_USER: popqueue
      POSTGRES_PASSWORD: popqueue_dev_password   # dev value only - overridden by .env in staging
      POSTGRES_DB: popqueue
    ports:
      - "5432:5432"
    volumes:
      - popqueue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popqueue -d popqueue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  popqueue_pgdata:
